<script>
        // Инициализируем Telegram сразу и жестко
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand(); // Развернуть на весь экран телефона
        }
        
        // Ссылка на ваш Google скрипт
        const WEB_APP_URL = "https://google.com";
        
        // Получаем ID пользователя
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "522983187"; 

        // Если зашли вы (Начальник) — показываем внизу зеленую кнопку перехода к таблице
        if (String(userId) === "522983187") {
            document.getElementById("boss-panel").style.display = "block";
        }

        // Функция отправки заявки в Google Таблицу
        function submitMechanicTicket() {
            const vehicle = document.getElementById("mech-vehicle").value.trim();
            const mileage = document.getElementById("mech-mileage").value.trim();
            const desc = document.getElementById("mech-desc").value.trim();
            
            if (!vehicle || !desc) {
                alert("Пожалуйста, заполните Гос. номер и Неисправность!");
                return;
            }
            
            // Отправляем данные в таблицу
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    action: "createTicket",
                    vehicle: vehicle,
                    mileage: mileage,
                    description: desc
                })
            });

            // Показываем сообщение об успехе БЕЗ ожидания ответа, чтобы обойти любые ошибки кэша
            alert("Заявка принята и отправлена в Журнал ремонтов!");
            
            if (tg) {
                tg.close(); // Закрываем окно приложения в Telegram
            }
        }
    </script>
